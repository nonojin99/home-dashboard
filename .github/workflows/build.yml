name: 대시보드 갱신

on:
  schedule:
    - cron: "17 22 * * *" # 매일 KST 07:17
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 거래 이력 Supabase 적재 (실패해도 페이지는 만든다)
        continue-on-error: true
        env:
          DATA_GO_KR_API_KEY: ${{ secrets.DATA_GO_KR_API_KEY }}
          TRADE_INGEST_TOKEN: ${{ secrets.TRADE_INGEST_TOKEN }}
        run: python ingest.py
      - name: 금리 캐시 (ECOS가 느릴 때 마지막 값 사용)
        uses: actions/cache@v4
        with:
          path: rates_cache.json
          key: rates-${{ github.run_id }}
          restore-keys: rates-
      - name: 실거래가 받아서 페이지 만들기
        env:
          DATA_GO_KR_API_KEY: ${{ secrets.DATA_GO_KR_API_KEY }}
          ECOS_API_KEY: ${{ secrets.ECOS_API_KEY }}
        run: python build.py
      - name: 주간 요약 메일 (월요일·수동 실행·커밋에 [mail] 포함 시)
        continue-on-error: true
        env:
          MAIL_USER: ${{ secrets.MAIL_USER }}
          MAIL_APP_PASSWORD: ${{ secrets.MAIL_APP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          EVENT_NAME: ${{ github.event_name }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: python mail.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
